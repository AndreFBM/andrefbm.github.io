<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — André Monteiro</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;600;700&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff5d9;
        --text: #1a1424;
        --soft: #4b4159;
        --line: #1a1424;
        --violet: #9470db;
        --violet-text: #6b4bc0;
        --cherry: #e72d49;
        --surface: #fffbef;
        --shadow: #1a1424;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #120d1c;
          --text: #fff5d9;
          --soft: rgba(255, 245, 217, 0.74);
          --line: #fff5d9;
          --violet-text: #b9a2f2;
          --surface: #1d1630;
          --shadow: #9470db;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(50% 50% at 85% 10%, color-mix(in srgb, var(--violet) 30%, transparent), transparent 70%),
          radial-gradient(40% 40% at 0% 100%, color-mix(in srgb, var(--cherry) 15%, transparent), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .wrap { width: min(640px, 100%); }
      h1 {
        margin: 0;
        font-size: clamp(6rem, 30vw, 13rem);
        font-weight: 800;
        line-height: 0.82;
        letter-spacing: -0.07em;
        color: var(--violet);
      }
      h1 span { color: var(--cherry); }
      h2 {
        margin: 18px 0 0;
        font-size: clamp(1.8rem, 6vw, 2.8rem);
        font-weight: 780;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      h2 em { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: var(--violet-text); }
      .term {
        margin: 28px 0 32px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: #17111f;
        color: #efe6ff;
        box-shadow: 8px 8px 0 var(--violet);
        font: 0.86rem/1.7 "JetBrains Mono", ui-monospace, Consolas, monospace;
        overflow: hidden;
        transform: rotate(-1deg);
      }
      .term p { margin: 0; padding: 0 18px; white-space: pre-wrap; }
      .term p:first-child { padding-top: 16px; }
      .term p:last-child { padding-bottom: 18px; }
      .kw { color: #b9a2f2; font-weight: 700; }
      .st { color: #ffe7a3; }
      .cm { color: rgba(255, 245, 217, 0.5); }
      .err { color: #ff6b80; }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 54px;
        padding: 0 24px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: var(--text);
        color: var(--bg);
        font-weight: 700;
        text-decoration: none;
        box-shadow: 4px 4px 0 var(--cherry);
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }
      a.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--cherry); }
      :focus-visible { outline: 3px solid var(--cherry); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>404<span>.</span></h1>
      <h2>This route returned <em>no rows.</em></h2>
      <div class="term" role="img" aria-label="SQL query for the missing page returning zero rows">
        <p><span class="kw">SELECT</span> * <span class="kw">FROM</span> pages</p>
        <p><span class="kw">WHERE</span> url = <span class="st" data-path>'/this-page'</span>;</p>
        <p class="cm">-- (0 rows affected)</p>
        <p class="err">⚠ the page moved, or never existed</p>
      </div>
      <a class="btn" href="/">Back to André Monteiro <span aria-hidden="true">→</span></a>
    </main>
    <script>
      try {
        var p = location.pathname.replace(/'/g, "''");
        if (p.length > 42) p = p.slice(0, 40) + '…';
        document.querySelector('[data-path]').textContent = "'" + p + "'";
      } catch (e) {}
    </script>
  </body>
</html>
